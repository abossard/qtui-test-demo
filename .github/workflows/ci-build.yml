name: CI Build

on:
  push:
    branches: [ main, 001-space-cockpit-kitchensink ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt (minimal Widgets)
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase6-dev
      - name: Configure (CMake)
        run: cmake -S . -B build -DENABLE_SPACE_COCKPIT=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: ctest --test-dir build --output-on-failure
